name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # No manifest yet (static site): no install/build/test commands exist.
      # Add pyproject.toml + uv steps here once the Python package lands.
      - name: Build
        run: echo "No build or test scripts defined yet"
