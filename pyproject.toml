[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "zk"
version = "0.1.0"
description = "Modular reverse-engineering pipeline for Zodiac Knights (Android, Unity/IL2CPP)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
assets = ["UnityPy==1.25.4", "TypeTreeGeneratorAPI==0.0.10"]
dev = ["pytest==9.2.0", "UnityPy==1.25.4", "TypeTreeGeneratorAPI==0.0.10"]

[project.scripts]
zk = "zk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"zk.adapters.ghidra" = ["scripts/*.java"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.pyright]
extraPaths = ["src", "."]
# downloaded tools ship their own scripts (e.g. Ghidra Jython); not our code
exclude = ["tools", "workspace", "raw", "**/__pycache__", "**/.*"]
